<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{{title}}, an essay by Pritam Pebam."
    />
    <title>{{title}} · Pritam Pebam</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Google+Sans:ital,opsz,wght,GRAD@0,17..18,400..700,0..100;1,17..18,400..700,0..100&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/essay/{{slug}}/article.css" />
  </head>
  <body>
    <main class="page">
      <article>
        <header class="article-header">
          <h1>{{title}}</h1>
          <time datetime="{{date}}">{{longDate}}</time>
        </header>

        <div class="article-body">
          <p class="placeholder">
            Draft. Replace everything in this folder freely — layout, fonts,
            width, scripts, and assets are local to this essay.
          </p>
        </div>
      </article>
    </main>
  </body>
</html>
